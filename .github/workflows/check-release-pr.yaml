name: Check PR to release-* branch

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - release-*
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: number

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  check-release-pr:
    name: Run check-release-pr for this PR
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Resolve PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            number="${{ inputs.pr_number }}"
          else
            number="${{ github.event.pull_request.number }}"
          fi
          echo "number=${number}" | tee -a "${GITHUB_OUTPUT}"

      - name: Install relacs
        id: install-relacs
        uses: stackrox/actions/release/install-relacs@61122692a35d71ac52614c09d0eb01b6497e0152 # ratchet:stackrox/actions/release/install-relacs@v1
        with:
          version: v0.0.15+check-release-pr

      - name: Check release branch PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # JIRA_USER secret contains the email address of the rhacs-bot user
          JIRA_EMAIL: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          # Extract the repository name from the full repository path
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "# Release branch PR check" | tee -a "${GITHUB_STEP_SUMMARY}"
          relacs github check-release-pr \
            --dry-run=false \
            --org "${GITHUB_REPOSITORY_OWNER}" \
            --repo "${REPO}" \
            --pull-request "${PR_NUMBER}" \
            --reviewer-login "github-actions[bot]" \
          2>&1 | tee -a "${GITHUB_STEP_SUMMARY}"
