name: Check PR to release-* branch

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - release-*
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: number

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  check-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Fetch PR details from the input
            PR_NUMBER="${{ inputs.pr_number }}"
            echo "Fetching PR #${PR_NUMBER} details..."

            PR_DATA=$(gh pr view "${PR_NUMBER}" --json url,headRepository,headRepositoryOwner,baseRefName)
            echo "pr_url=$(echo "${PR_DATA}" | jq -r '.url')" | tee -a "${GITHUB_OUTPUT}"
            echo "head_repo=$(echo "${PR_DATA}" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')" | tee -a "${GITHUB_OUTPUT}"
            echo "base_ref=$(echo "${PR_DATA}" | jq -r '.baseRefName')" | tee -a "${GITHUB_OUTPUT}"
            echo "is_fork=$([[ $(echo "${PR_DATA}" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name') != "${{ github.repository }}" ]] && echo "true" || echo "false")" | tee -a "${GITHUB_OUTPUT}"
          else
            # Use data from pull_request event
            echo "pr_url=${{ github.event.pull_request.html_url }}" | tee -a "${GITHUB_OUTPUT}"
            echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}" | tee -a "${GITHUB_OUTPUT}"
            echo "base_ref=${{ github.event.pull_request.base.ref }}" | tee -a "${GITHUB_OUTPUT}"
            echo "is_fork=${{ github.event.pull_request.head.repo.full_name != github.repository }}" | tee -a "${GITHUB_OUTPUT}"
          fi

      - name: Fail if fork PR
        if: steps.pr.outputs.is_fork == 'true'
        run: |
          echo "::error::PRs to release branches cannot be forks."
          echo "::error::Instead, let your PR target the default branch of this repository and the team will backport it, if necessary."
          exit 1

      - name: Install relacs
        id: install-relacs
        uses: stackrox/actions/release/install-relacs@577eac45215ba551032ad6fa8d9eb59671511787 # ratchet:stackrox/actions/release/install-relacs@v1
        with:
          relacs_install_path: /home/runner/relacs-dir
          token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}

      # Only install if cache missed
      - name: Install relacs
        id: install-relacs2
        uses: stackrox/actions/release/install-relacs@tm/configurable-install-dir-relacs # ratchet:stackrox/actions/release/install-relacs@v1
        with:
          relacs_install_path: "$HOME/relacs-dir"
          token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}

      # Only install if cache missed
      - name: Install relacs
        id: install-relacs3
        uses: stackrox/actions/release/install-relacs@tm/configurable-install-dir-relacs # ratchet:stackrox/actions/release/install-relacs@v1
        with:
          relacs_install_path: $HOME_SWEET_HOME/relacs-dir
          token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}

      - name: Check release branch PR
        env:
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          # JIRA_USER secret contains the email address of the rhacs-bot user
          JIRA_EMAIL: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          KUBECTL_PLUGIN_KA_HOST: ${{ vars.ACS_KUBECTL_PLUGIN_KA_HOST }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -uo pipefail
          echo "# Release branch PR check results" | tee -a "${GITHUB_STEP_SUMMARY}"
          relacs github check-release-pr --pull-request "${PR_URL}" | tee -a "${GITHUB_STEP_SUMMARY}"
