name: Check PR to release-* branch

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - release-*

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  check-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if fork PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PRs to release branches cannot be forks."
          echo "::error::Instead, let your PR target the default branch of this repository and the team will backport it, if necessary."
          exit 1

      - name: Install relacs
        id: install-relacs
        uses: stackrox/actions/release/install-relacs@577eac45215ba551032ad6fa8d9eb59671511787 # ratchet:stackrox/actions/release/install-relacs@v1
        with:
          token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}

      - name: Check release branch PR
        env:
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          # JIRA_USER secret contains the email address of the rhacs-bot user
          JIRA_EMAIL: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          KUBECTL_PLUGIN_KA_HOST: ${{ vars.ACS_KUBECTL_PLUGIN_KA_HOST }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          echo "# Release branch PR check results" | tee -a "${GITHUB_STEP_SUMMARY}"
          relacs github check-release-pr --pull-request "${PR_URL}" | tee -a "${GITHUB_STEP_SUMMARY}"
