name: backport-check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - release-*

jobs:
  check-backport:
    name: "Check backport status"
    runs-on: ubuntu-latest
    steps:
      - name: Install relacs
        env:
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
        uses: stackrox/actions/release/install-relacs@v1
        with:
          token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          # TODO: Remove specific version selector once a new version is released
          version: v0.0.11+rc

      - name: Check backport
        env:
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          # JIRA_USER secret contains the email address of the rhacs-bot user
          JIRA_EMAIL: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          KUBECTL_PLUGIN_KA_HOST: ${{ vars.ACS_KUBECTL_PLUGIN_KA_HOST }}
        run: |
          echo "# Backport check results" >> $GITHUB_STEP_SUMMARY
          relacs github backport-check --pull-request ${{ github.event.pull_request.html_url }} >> $GITHUB_STEP_SUMMARY
