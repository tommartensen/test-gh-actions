name: Periodically run check-release-pr for all release-* PRs

on:
  # schedule:
    # # Every 15 minutes
    # - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  periodic-check-release-pr:
    name: Run check-release-pr for all release-* PRs
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-periodic
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install relacs
        id: install-relacs
        uses: stackrox/actions/release/install-relacs@577eac45215ba551032ad6fa8d9eb59671511787 # ratchet:stackrox/actions/release/install-relacs@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v0.0.15+check-release-pr

      - name: Check release branch PRs
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # JIRA_USER secret contains the email address of the rhacs-bot user
          JIRA_EMAIL: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          set -uo pipefail
          # Extract the repository name from the full repository path
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "# Release branch PR check results" | tee -a "${GITHUB_STEP_SUMMARY}"
          relacs github check-release-pr --dry-run=false --org "${GITHUB_REPOSITORY_OWNER}" --repo "${REPO}" --reviewer-login "github-actions[bot]" | tee -a "${GITHUB_STEP_SUMMARY}"
