name: Backport PR to release branch
on:
  pull_request_target:
    types:
      - closed
      - labeled

jobs:
  backport:
    name: Backport
    runs-on: ubuntu-latest
    # Only react to merged PRs for security reasons.
    # See https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target.
    if: >
      github.event.pull_request.merged
      && (
        github.event.action == 'closed'
        || (
          github.event.action == 'labeled'
          && contains(github.event.label.name, 'backport release-')
        )
      )
    steps:
      - uses: tibdex/backport@9565281eda0731b1d20c4025c43339fb0a23812e # ratchet:tibdex/backport@v2.0.4
        id: backport
        with:
          github_token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          title_template: "<%= title %> (<%= base %>)"
          label_pattern: 'backport (?<base>(release-[0-9]+\.[0-9]+))$'
          labels_template: '["backport"]'

      - name: Assign backport PRs to original author
        if: steps.backport.outputs.created_pull_requests != ''
        env:
          GH_TOKEN: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}
          CREATED_PRS: ${{ steps.backport.outputs.created_pull_requests }}
          ORIGINAL_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Created PRs: ${CREATED_PRS}"
          echo "Original author: ${ORIGINAL_AUTHOR}"

          # Parse the JSON object and extract PR numbers
          for pr_number in $(echo "${CREATED_PRS}" | jq -r '.[]'); do
            echo "Assigning PR #${pr_number} to ${ORIGINAL_AUTHOR}"
            gh pr edit "${pr_number}" --add-assignee "${ORIGINAL_AUTHOR}" --repo "${{ github.repository }}"
          done
